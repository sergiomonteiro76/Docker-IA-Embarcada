# docker-compose-final.yml
# Configuração final corrigida com versões compatíveis

services:
  api-ia:
    # Nome do serviço
    container_name: api-ia-flask
    
    # Construir a partir do Dockerfile.fixed
    build:
      context: .
      dockerfile: Dockerfile.fixed
    
    # Mapeamento de portas (host:container)
    ports:
      - "5000:5000"
    
    # Variáveis de ambiente
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    
    # Volumes para persistir cache dos modelos
    volumes:
      - modelos-cache:/root/.cache/huggingface
    
    # Política de reinicialização
    restart: unless-stopped
    
    # Healthcheck para monitorar saúde do container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

# Definição de volumes nomeados
volumes:
  modelos-cache:
    driver: local

